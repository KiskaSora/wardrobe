<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой гардероб</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fdf6f8;--card:#fff;--tx:#2b2226;--mut:#8a7a80;--ac:#d6578a;--ac2:#fbe1ec;--bd:#f0d9e2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1619;--card:#272024;--tx:#f3e8ed;--mut:#a8959d;--ac:#ef7aa8;--ac2:#3a2530;--bd:#3d2d35}}
:root[data-theme="dark"]{--bg:#1c1619;--card:#272024;--tx:#f3e8ed;--mut:#a8959d;--ac:#ef7aa8;--ac2:#3a2530;--bd:#3d2d35}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 14px 110px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px}
.top{display:flex;align-items:center;gap:8px}
h1{font-size:21px;margin:0;flex:1;display:flex;align-items:center;gap:8px}
button{font:inherit;border:0;border-radius:14px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
button.ghost{background:var(--ac2);color:var(--ac)}
button.ic{padding:0;width:42px;height:42px}
button.link{background:none;color:var(--mut);font-size:13px;padding:6px}
.dot{position:relative}.dot::after{content:'';position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:#ffd24a;border:2px solid var(--bg)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:9px 16px}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tab.new{background:none;border:1.5px dashed var(--ac);color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:10px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.ph{aspect-ratio:3/4;background:var(--ac2);display:flex}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.it p{margin:0;padding:9px 11px 11px;font-size:13px;line-height:1.35;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(2*1.35em + 20px)}
.empty{grid-column:1/-1;color:var(--mut);text-align:center;padding:48px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
#foot{text-align:center;margin-top:18px}
#fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;padding:0;box-shadow:0 6px 18px rgba(214,87,138,.45)}
#fab .i{width:28px;height:28px}
dialog{border:0;border-radius:20px;padding:16px;background:var(--card);color:var(--tx);width:min(92vw,440px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
#vImg{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;display:block;margin-bottom:10px;background:var(--ac2)}
#aPrev{width:100%;max-height:30vh;object-fit:contain;border-radius:12px;margin-top:8px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.row button{flex:1;min-width:110px}
.note{font-size:12px;color:var(--mut);margin:6px 0 0}
#st{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center;z-index:20}
#st.on{opacity:1}
.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-hanger" viewBox="0 0 24 24"><path d="M12 7a2.5 2.5 0 1 0-2.5-2.5M12 7v2.5L2.5 17a1.5 1.5 0 0 0 1 2.7h17a1.5 1.5 0 0 0 1-2.7L12 9.5"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</defs></svg>

<div class="wrap">
 <header>
  <div class="top">
   <h1><svg class="i"><use href="#i-hanger"/></svg> Мой гардероб</h1>
   <button class="ghost ic" onclick="pull()" aria-label="Обновить с GitHub"><svg class="i"><use href="#i-down"/></svg></button>
   <button id="bPush" onclick="push()"><svg class="i"><use href="#i-up"/></svg> На GitHub</button>
   <button class="ghost ic" onclick="openGh()" aria-label="Настройки GitHub"><svg class="i"><use href="#i-gear"/></svg></button>
  </div>
  <div class="tabs" id="tabs"></div>
 </header>
 <div class="grid" id="grid"></div>
 <div id="foot"></div>
</div>
<button id="fab" onclick="openAdd()" aria-label="Добавить вещь" hidden><svg class="i"><use href="#i-plus"/></svg></button>

<dialog id="dView"><img id="vImg" alt="">
  <textarea id="vDesc" rows="4" placeholder="Описание"></textarea>
  <div class="row">
    <button onclick="copyImg()"><svg class="i"><use href="#i-copy"/></svg> Копировать</button>
    <button class="ghost" onclick="saveImg()"><svg class="i"><use href="#i-dl"/></svg> Скачать</button>
  </div>
  <div class="row">
    <button class="ghost" onclick="delItem()"><svg class="i"><use href="#i-trash"/></svg> Удалить</button>
    <button class="ghost" onclick="dView.close()">Закрыть</button>
  </div>
  <p class="note">На телефоне можно зажать картинку и выбрать «Сохранить» или «Копировать».</p>
</dialog>

<dialog id="dAdd"><b>Новая вещь</b>
  <input type="file" id="aFile" accept="image/*" onchange="aPrev.src=URL.createObjectURL(this.files[0])">
  <img id="aPrev" alt="">
  <textarea id="aDesc" rows="3" placeholder="Описание: что это, с чем носить…"></textarea>
  <div class="row"><button onclick="addItem()">Добавить</button><button class="ghost" onclick="dAdd.close()">Отмена</button></div>
</dialog>

<dialog id="dGh"><b>Настройки GitHub</b>
  <input id="gUser" placeholder="Твой логин GitHub">
  <input id="gRepo" placeholder="Название репозитория">
  <input id="gTok" type="password" placeholder="Токен (нужен только для сохранения)">
  <p class="note">Токен хранится только в этом браузере. Чтобы просто смотреть гардероб на другом устройстве, токен не нужен.</p>
  <div class="row"><button onclick="saveGh()">Сохранить</button><button class="ghost" onclick="dGh.close()">Закрыть</button></div>
</dialog>
<div id="st"></div>

<script>
const $=id=>document.getElementById(id);
const ICON=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={cats:[],items:[]},cur=null,openId=null,G={},dirty=false,lastPush=0;
try{const s=localStorage.getItem('wd');if(s)S=JSON.parse(s);G=JSON.parse(localStorage.getItem('wdg')||'{}');dirty=localStorage.getItem('wdd')==='1';lastPush=+localStorage.getItem('wdp')||0}catch(e){}
function toast(t){const e=$('st');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)}
function save(){try{localStorage.setItem('wd',JSON.stringify(S))}catch(e){toast('Память браузера заполнена, сохрани на GitHub')}}
function mark(v){dirty=v;try{localStorage.setItem('wdd',v?'1':'0')}catch(e){}$('bPush').classList.toggle('dot',v)}
function commit(){save();mark(true)}
function clean(){const n=S.items.length+S.cats.length;S.items=S.items.filter(i=>i.id!=='i1'&&i.id!=='i2');S.cats=S.cats.filter(c=>!['c1','c2','c3'].includes(c.id)||S.items.some(i=>i.cat===c.id));return n!==S.items.length+S.cats.length}
function retry(el){const n=+el.dataset.n||0;if(n>6)return;el.dataset.n=n+1;setTimeout(()=>{el.src=el.src.split('?')[0]+'?r='+Date.now()},10000)}

function render(){
  if(!S.cats.find(c=>c.id===cur))cur=S.cats[0]?.id||null;
  $('tabs').innerHTML=S.cats.map(c=>`<button class="tab ${c.id===cur?'on':''}" onclick="cur='${c.id}';render()">${esc(c.name)}</button>`).join('')+`<button class="tab new" onclick="addCat()">${ICON('plus')} Категория</button>`;
  const g=$('grid');
  if(!cur){g.innerHTML=`<div class="empty">Пока нет ни одной категории.<button onclick="addCat()">${ICON('plus')} Создать категорию</button></div>`;$('fab').hidden=true;$('foot').innerHTML='';return}
  $('fab').hidden=false;
  const its=S.items.filter(i=>i.cat===cur);
  g.innerHTML=its.length?its.map(i=>`<div class="it" onclick="view('${i.id}')"><div class="ph"><img src="${i.img}" alt="" loading="lazy" onerror="retry(this)"></div><p>${esc(i.desc||'Без описания')}</p></div>`).join(''):`<div class="empty">Здесь пока пусто. Нажми кнопку с плюсом внизу, чтобы добавить вещь.</div>`;
  $('foot').innerHTML=`<button class="link" onclick="delCat()">${ICON('trash')} Удалить категорию</button>`;
}
function addCat(){const n=prompt('Название категории:');if(!n||!n.trim())return;const id='c'+Date.now();S.cats.push({id,name:n.trim()});cur=id;commit();render()}
function delCat(){const c=S.cats.find(c=>c.id===cur);if(!confirm(`Удалить «${c.name}» вместе со всеми вещами?`))return;S.cats=S.cats.filter(x=>x.id!==cur);S.items=S.items.filter(i=>i.cat!==cur);commit();render()}
function openAdd(){$('aFile').value='';$('aDesc').value='';$('aPrev').removeAttribute('src');dAdd.showModal()}
function addItem(){
  const f=$('aFile').files[0];if(!f)return toast('Выбери фото');
  const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   S.items.push({id:'i'+Date.now(),cat:cur,desc:$('aDesc').value.trim(),img:c.toDataURL('image/jpeg',.85)});commit();dAdd.close();render();toast('Добавлено')};
  im.src=URL.createObjectURL(f);
}
function view(id){openId=id;const i=S.items.find(x=>x.id===id);$('vImg').src=i.img;$('vDesc').value=i.desc||'';dView.showModal()}
$('vDesc').addEventListener('change',()=>{const i=S.items.find(x=>x.id===openId);if(i){i.desc=$('vDesc').value.trim();commit();render()}});
function delItem(){if(!confirm('Удалить эту вещь?'))return;S.items=S.items.filter(i=>i.id!==openId);commit();dView.close();render()}
function toPng(src){return new Promise((ok,no)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);c.toBlob(ok,'image/png')};im.onerror=no;im.src=src})}
async function copyImg(){try{const b=await toPng($('vImg').src);await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Картинка скопирована')}catch(e){toast('Не вышло, зажми картинку и выбери «Копировать»')}}
async function saveImg(){try{const b=await toPng($('vImg').src);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='outfit-'+openId+'.png';a.click()}catch(e){toast('Не вышло, зажми картинку и выбери «Сохранить»')}}

function openGh(){$('gUser').value=G.u||'';$('gRepo').value=G.r||'';$('gTok').value=G.t||'';dGh.showModal()}
function saveGh(){G={u:$('gUser').value.trim(),r:$('gRepo').value.trim(),t:$('gTok').value.trim()};try{localStorage.setItem('wdg',JSON.stringify(G))}catch(e){}dGh.close();toast('Настройки сохранены')}
const api=p=>`https://api.github.com/repos/${G.u}/${G.r}/contents/${p}`;
const hd=()=>({Authorization:'Bearer '+G.t,Accept:'application/vnd.github+json'});
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function put(path,content64,msg){
  let sha;const r=await fetch(api(path),{headers:hd()});if(r.ok)sha=(await r.json()).sha;
  const w=await fetch(api(path),{method:'PUT',headers:hd(),body:JSON.stringify({message:msg,content:content64,sha})});
  if(!w.ok)throw new Error((await w.json()).message);
}
async function push(){
  if(!G.u||!G.r||!G.t){openGh();return toast('Сначала заполни настройки GitHub')}
  try{
    const out={cats:S.cats,items:[]},paths={};let n=0;
    for(const i of S.items){
      let img=i.img;
      if(img.startsWith('data:image/jpeg')){img='images/'+i.id+'.jpg';toast(`Загружаю фото ${++n}…`);await put(img,i.img.split(',')[1],'Add '+i.id);paths[i.id]=img}
      else if(img.startsWith('data:'))img='';
      out.items.push({id:i.id,cat:i.cat,desc:i.desc,img});
    }
    await put('wardrobe.json',b64(JSON.stringify(out,null,1)),'Update wardrobe');
    S.items.forEach(i=>{if(paths[i.id])i.img=paths[i.id]});
    lastPush=Date.now();try{localStorage.setItem('wdp',lastPush)}catch(e){}
    save();mark(false);render();toast('Всё сохранено на GitHub')
  }catch(e){toast('Ошибка GitHub: '+e.message)}
}
async function pull(silent){
  if(silent!==true&&dirty&&!confirm('Есть несохранённые изменения, они пропадут. Продолжить?'))return;
  try{
    let d;
    if(G.u&&G.r&&G.t){const r=await fetch(api('wardrobe.json'),{headers:hd()});if(!r.ok)throw new Error('файл не найден');d=JSON.parse(decodeURIComponent(escape(atob((await r.json()).content.replace(/\n/g,'')))))}
    else{const r=await fetch('wardrobe.json?t='+Date.now());if(!r.ok)throw new Error('файл не найден');d=await r.json()}
    S=d;const ch=clean();save();mark(ch);render();if(silent!==true)toast('Обновлено')
  }catch(e){if(silent!==true)toast('Ошибка: '+e.message)}
}
if(clean())mark(true);
mark(dirty);render();
if(!dirty&&Date.now()-lastPush>600000)pull(true);
</script>
</body>
</html>
