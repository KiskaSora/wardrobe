<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой гардероб</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fdf6f8;--card:#fff;--tx:#2b2226;--mut:#8a7a80;--ac:#d6578a;--ac2:#fbe1ec;--bd:#f0d9e2}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1619;--card:#272024;--tx:#f3e8ed;--mut:#a8959d;--ac:#ef7aa8;--ac2:#3a2530;--bd:#3d2d35}}
:root[data-theme="dark"]{--bg:#1c1619;--card:#272024;--tx:#f3e8ed;--mut:#a8959d;--ac:#ef7aa8;--ac2:#3a2530;--bd:#3d2d35}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.ghost{background:var(--ac2);color:var(--ac)}
button.small{padding:6px 10px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.gh{flex:1;min-width:200px;font-size:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.tab{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer}
.it img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.it p{margin:0;padding:8px 10px;font-size:13px;color:var(--mut)}
.add{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;border:2px dashed var(--ac);color:var(--ac);border-radius:14px;font-size:34px;cursor:pointer;background:transparent}
.empty{color:var(--mut);padding:24px 0;text-align:center}
dialog{border:0;border-radius:18px;padding:16px;background:var(--card);color:var(--tx);width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog img{width:100%;max-height:55vh;object-fit:contain;border-radius:12px;display:block;margin-bottom:10px}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.note{font-size:12px;color:var(--mut)}
.i{width:1.1em;height:1.1em;vertical-align:-.17em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.add .i{width:34px;height:34px}
#st{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#st.on{opacity:1}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-hanger" viewBox="0 0 24 24"><path d="M12 7a2.5 2.5 0 1 0-2.5-2.5M12 7v2.5L2.5 17a1.5 1.5 0 0 0 1 2.7h17a1.5 1.5 0 0 0 1-2.7L12 9.5"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</defs></svg>
<div class="wrap">
  <h1><span><svg class="i"><use href="#i-hanger"/></svg> Мой гардероб</span> <button class="ghost small" onclick="openGh()"><svg class="i"><use href="#i-gear"/></svg> GitHub</button></h1>
  <div class="bar">
    <button class="gh" onclick="push()"><svg class="i"><use href="#i-up"/></svg> Сохранить всё на GitHub</button>
    <button class="ghost" onclick="pull()"><svg class="i"><use href="#i-down"/></svg> Загрузить с GitHub</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>

<dialog id="dView"><img id="vImg" alt=""><p id="vDesc"></p>
  <div class="row">
    <button onclick="copyImg()"><svg class="i"><use href="#i-copy"/></svg> Копировать</button>
    <button class="ghost" onclick="saveImg()"><svg class="i"><use href="#i-dl"/></svg> Сохранить</button>
    <button class="ghost" onclick="delItem()" aria-label="Удалить"><svg class="i"><use href="#i-trash"/></svg></button>
    <button class="ghost" onclick="dView.close()">Закрыть</button>
  </div>
  <p class="note">На телефоне можно ещё зажать картинку пальцем и выбрать «Сохранить».</p>
</dialog>

<dialog id="dAdd"><b>Новая вещь</b>
  <input type="file" id="aFile" accept="image/*">
  <textarea id="aDesc" rows="3" placeholder="Описание: что это, с чем носить…"></textarea>
  <div class="row"><button onclick="addItem()">Добавить</button><button class="ghost" onclick="dAdd.close()">Отмена</button></div>
</dialog>

<dialog id="dGh"><b>Настройки GitHub</b>
  <input id="gUser" placeholder="Твой логин GitHub">
  <input id="gRepo" placeholder="Название репозитория (например wardrobe)">
  <input id="gTok" type="password" placeholder="Токен (Personal Access Token)">
  <p class="note">Токен хранится только в этом браузере. Нужны права Contents: read &amp; write для этого репозитория.</p>
  <div class="row"><button onclick="saveGh()">Сохранить</button><button class="ghost" onclick="dGh.close()">Закрыть</button></div>
</dialog>
<div id="st"></div>

<script>
const $=id=>document.getElementById(id);
const svg=(a,b)=>"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient></defs><rect width='300' height='400' fill='url(#g)'/></svg>`);
let S={cats:[{id:'c1',name:'Платья'},{id:'c2',name:'Верх'},{id:'c3',name:'Низ'}],
 items:[{id:'i1',cat:'c1',desc:'Пример: чёрное платье',img:svg('#2b2226','#d6578a')},{id:'i2',cat:'c2',desc:'Пример: розовый топ',img:svg('#f7b6cf','#fbe1ec')}]};
let cur='c1',openId=null,G={};
try{const s=localStorage.getItem('wd');if(s)S=JSON.parse(s);G=JSON.parse(localStorage.getItem('wdg')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('wd',JSON.stringify(S))}catch(e){toast('Память браузера заполнена — выгрузи на GitHub')}};
function toast(t){const e=$('st');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function render(){
  if(!S.cats.find(c=>c.id===cur))cur=S.cats[0]?.id;
  $('tabs').innerHTML=S.cats.map(c=>`<button class="tab ${c.id===cur?'on':''}" onclick="cur='${c.id}';render()">${esc(c.name)}</button>`).join('')+
   `<button class="ghost" onclick="addCat()"><svg class="i"><use href="#i-plus"/></svg> Категория</button>`+(cur?`<button class="ghost" onclick="delCat()" aria-label="Удалить категорию"><svg class="i"><use href="#i-x"/></svg></button>`:'');
  const its=S.items.filter(i=>i.cat===cur);
  $('grid').innerHTML=`<div class="add" onclick="$('aFile').value='';$('aDesc').value='';dAdd.showModal()"><svg class="i"><use href="#i-plus"/></svg></div>`+
   its.map(i=>`<div class="it" onclick="view('${i.id}')"><img src="${i.img}" alt=""><p>${esc(i.desc||'')}</p></div>`).join('');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function addCat(){const n=prompt('Название категории:');if(!n)return;const id='c'+Date.now();S.cats.push({id,name:n});cur=id;save();render()}
function delCat(){const c=S.cats.find(c=>c.id===cur);if(!confirm(`Удалить «${c.name}» вместе со всеми вещами?`))return;S.cats=S.cats.filter(x=>x.id!==cur);S.items=S.items.filter(i=>i.cat!==cur);save();render()}
function view(id){openId=id;const i=S.items.find(x=>x.id===id);$('vImg').src=i.img;$('vDesc').textContent=i.desc||'';dView.showModal()}
function delItem(){if(!confirm('Удалить эту вещь?'))return;S.items=S.items.filter(i=>i.id!==openId);save();dView.close();render()}
function addItem(){
  const f=$('aFile').files[0];if(!f)return toast('Выбери фото');
  const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   S.items.push({id:'i'+Date.now(),cat:cur,desc:$('aDesc').value.trim(),img:c.toDataURL('image/jpeg',.85)});save();dAdd.close();render();toast('Добавлено')};
  im.src=URL.createObjectURL(f);
}
async function toPng(src){return new Promise((ok,no)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);c.toBlob(ok,'image/png')};im.onerror=no;im.src=src})}
async function copyImg(){try{const b=await toPng($('vImg').src);await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Картинка скопирована')}catch(e){toast('Не вышло — зажми картинку и выбери «Копировать»')}}
function saveImg(){const a=document.createElement('a');a.href=$('vImg').src;a.download='outfit-'+openId+'.jpg';a.click();toast('Сохраняю…')}
function openGh(){$('gUser').value=G.u||'';$('gRepo').value=G.r||'';$('gTok').value=G.t||'';dGh.showModal()}
function saveGh(){G={u:$('gUser').value.trim(),r:$('gRepo').value.trim(),t:$('gTok').value.trim()};try{localStorage.setItem('wdg',JSON.stringify(G))}catch(e){}dGh.close();toast('Настройки сохранены')}
const api=p=>`https://api.github.com/repos/${G.u}/${G.r}/contents/${p}`;
const hd=()=>({Authorization:'Bearer '+G.t,Accept:'application/vnd.github+json'});
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function put(path,content64,msg){
  let sha;const r=await fetch(api(path),{headers:hd()});if(r.ok)sha=(await r.json()).sha;
  const w=await fetch(api(path),{method:'PUT',headers:hd(),body:JSON.stringify({message:msg,content:content64,sha})});
  if(!w.ok)throw new Error((await w.json()).message);
}
async function push(){
  if(!G.u||!G.r||!G.t){openGh();return toast('Сначала заполни настройки GitHub')}
  try{
    const out={cats:S.cats,items:[]};let n=0;
    for(const i of S.items){
      let img=i.img;
      if(img.startsWith('data:image/jpeg')){img='images/'+i.id+'.jpg';toast(`Загружаю фото ${++n}…`);await put(img,i.img.split(',')[1],'Add '+i.id)}
      else if(img.startsWith('data:'))img='';
      out.items.push({id:i.id,cat:i.cat,desc:i.desc,img});
    }
    await put('wardrobe.json',b64(JSON.stringify(out,null,1)),'Update wardrobe');
    toast('Всё сохранено на GitHub')
  }catch(e){toast('Ошибка GitHub: '+e.message)}
}
async function pull(){
  if(!G.u||!G.r||!G.t){openGh();return toast('Сначала заполни настройки GitHub')}
  try{
    const r=await fetch(api('wardrobe.json'),{headers:hd()});if(!r.ok)throw new Error('файл не найден');
    const d=JSON.parse(decodeURIComponent(escape(atob((await r.json()).content.replace(/\n/g,'')))));
    for(const i of d.items){if(i.img.startsWith('images/')){const f=await fetch(api(i.img),{headers:hd()});if(f.ok)i.img='data:image/jpeg;base64,'+(await f.json()).content.replace(/\n/g,'')}}
    S=d;save();render();toast('Загружено с GitHub')
  }catch(e){toast('Ошибка: '+e.message)}
}
render();
</script>
</body>
</html>
